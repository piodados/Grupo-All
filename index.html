<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Guia de Operação Zig</title><style>
:root{--bg:#F4F7FF;--card:#fff;--ink:#0A1A5C;--tx:#2B3350;--mu:#5B6488;--bl:#0052C2;--cy:#00E5F5;--ln:#D6DFF5;--wa:#FFF4DB;--wt:#7A5200;--in:#E3EEFF;--ok:#E1F7EA;--okt:#0B6B3A;--er:#FDE6E6;--ert:#9B1C1C;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1230;--card:#131C45;--ink:#EAF0FF;--tx:#CBD5F5;--mu:#98A4D0;--ln:#26346E;--wa:#3A2E0B;--wt:#FFD98A;--in:#12285C;--ok:#0E3322;--okt:#8CE8B4;--er:#411616;--ert:#FFB4B4}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.splash{position:fixed;inset:0;background:#0052C2;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.splash img{width:150px;margin-bottom:28px}.splash h1{margin:0 0 10px;font-size:26px;letter-spacing:.5px}.splash p{margin:0;color:#7FF4FF}
.splash .mar img.zg,.splash .mar img.ga{height:min(92px,calc((100vw - 70px)/3.3));width:auto}.splash .mar{gap:20px}.splash{cursor:pointer}.splash .mar{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:28px}.splash .mar img{height:min(86px,calc((100vw - 66px)/5.1));width:auto;margin:0}.splash h1{text-wrap:balance}.splash .mar h1{margin:0;font-size:clamp(30px,9.5vw,44px);line-height:1}.splash img.vl{height:min(86px,calc((100vw - 66px)/5.1));width:auto;margin:0}.splash .tap{position:absolute;bottom:calc(120px + env(safe-area-inset-bottom,0px));left:0;right:0;font-size:14px;color:#fff;opacity:.85}.splash h1{font-size:28px}.splash:after{content:"";position:absolute;left:12%;bottom:0;width:90px;height:90px;border-radius:0 90px 0 0;background:#00E5F5}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:2;border-bottom:1px solid var(--ln)}
header button{border:0;background:var(--bl);color:#fff;border-radius:10px;padding:8px 12px;font:600 14px inherit;font-family:inherit;cursor:pointer}header b{flex:1;color:var(--ink);font-size:15px}
header img{height:22px}
main{padding:18px 16px 28px;flex:1}h2{color:var(--ink);font-size:24px;line-height:1.2;margin:0 0 6px}.sub{color:var(--mu);margin:0 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;min-height:112px;display:flex;flex-direction:column;gap:10px}
.mvs{display:inline-flex;gap:6px;margin-left:8px}.mv{width:34px;height:34px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--ink);font-size:17px;line-height:1;cursor:pointer}.mv:disabled{opacity:.3;cursor:default}.num{background:var(--bl);color:#fff;border-radius:999px;min-width:36px;height:36px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;white-space:nowrap;align-self:flex-start}
.card span.n{font-weight:700;line-height:1.25}.soon{font-size:12px;color:var(--mu);margin-top:auto}
.item{display:block;width:100%;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:10px;text-align:left;font:inherit;cursor:pointer;color:var(--ink)}.item b{display:block;font-size:17px}.item small{color:var(--mu)}
.box{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}.box h3{margin:0 0 6px;color:var(--ink);font-size:16px}.box p{margin:0}
ol.st{list-style:none;margin:0 0 14px;padding:0;counter-reset:s}ol.st li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--ln)}
ol.st li:before{content:counter(s);background:var(--bl);color:#fff;min-width:28px;height:28px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;white-space:nowrap}
ul{margin:6px 0 0;padding-left:20px}.note{border-radius:12px;padding:12px 14px;margin-bottom:12px}.note b{display:block;font-size:13px}
.a{background:var(--wa);color:var(--wt)}.i{background:var(--in);color:var(--ink)}.o{background:var(--ok);color:var(--okt)}.e{background:var(--er);color:var(--ert)}
pre{white-space:pre-wrap;background:var(--card);border:1px dashed var(--bl);border-radius:12px;padding:14px;font:14px/1.5 ui-monospace,Menlo,monospace;margin:0 0 10px}
.btn{border:0;background:var(--bl);color:#fff;border-radius:12px;padding:12px 16px;font:600 15px inherit;font-family:inherit;width:100%;cursor:pointer;margin-bottom:12px}.btn.l{background:var(--in);color:var(--ink)}
.pn{display:flex;gap:10px;margin-top:18px}.pn .btn{margin:0}.pn .btn:disabled{opacity:.35}
img.f{max-width:220px;width:100%;border-radius:10px;border:1px solid var(--ln);display:block;margin:6px auto 12px}
img.pl{width:100%;border-radius:10px;border:1px solid var(--ln);display:block;margin:8px 0 10px;cursor:zoom-in}.zm{position:fixed;inset:0;background:#000;z-index:9;display:flex;flex-direction:column}.zb{padding:10px 12px;text-align:right}.zb button{border:0;background:#fff;color:#000;border-radius:10px;padding:8px 14px;font:600 14px system-ui}.zs{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}.zs img{width:220%;max-width:none;display:block}
label{display:block;margin:10px 0;font-size:14px;color:var(--mu)}label input{display:block;width:100%;margin-top:4px;padding:12px;border:1px solid var(--ln);border-radius:10px;background:var(--card);color:var(--ink);font:16px inherit;font-family:inherit}p,li,.note,.sub{white-space:pre-line}label textarea{display:block;width:100%;margin-top:4px;padding:12px;border:1px solid var(--ln);border-radius:10px;background:var(--card);color:var(--ink);font:16px/1.4 inherit;font-family:inherit;resize:vertical;box-sizing:border-box}.mv.ed{margin-left:8px}.row .mv.ed{margin:0 8px 0 auto;flex:none}.mu{color:var(--mu);font-size:13px;min-height:18px}.zm2{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9;display:flex;align-items:flex-end;justify-content:center}.zm2 .mb{background:var(--bg);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}.zm2 h3{margin:0 0 10px;color:var(--ink)}.zm2 .btn{margin-bottom:8px}details{display:block}.tree details{background:var(--card);border:1px solid var(--ln);border-radius:12px;margin-bottom:8px}.tree details details{margin:0 10px 8px;background:var(--bg)}.tree summary{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;list-style:none;min-height:52px}.tree summary::-webkit-details-marker{display:none}.tree .ch{color:var(--mu);font-size:20px;line-height:1;transition:transform .12s;width:12px}.tree details[open]>summary>.ch{transform:rotate(90deg)}.tree .lab{flex:1;min-width:0;color:var(--ink)}.tree .lab b{display:block;line-height:1.3}.tree .lab small{color:var(--mu);font-size:12px}.tree .tag{display:none;font-size:12px;color:var(--wt);background:var(--wa);border-radius:99px;padding:2px 8px}.tree .off>summary .tag{display:inline}.tree details.off>.kids{opacity:.5}.tree .row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--ln);min-height:48px;font-size:14px}.tree .row.off .lab{text-decoration:line-through;opacity:.6}input.sw{-webkit-appearance:none;appearance:none;width:48px;height:28px;border-radius:99px;background:#8d97b8;position:relative;flex:none;cursor:pointer;margin:0;transition:background .15s}input.sw:before{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}input.sw:checked{background:var(--bl)}input.sw:checked:before{transform:translateX(20px)}input.sw:focus-visible{outline:3px solid var(--cy);outline-offset:2px}.lk{background:none;border:0;padding:0;font:inherit;color:LinkText;text-decoration:underline;cursor:pointer}.toast{display:none;position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:488px;margin:0 auto;background:#0A1A5C;color:#fff;padding:12px 14px;border-radius:12px;z-index:20;font-size:14px}footer{text-align:center;color:var(--mu);font-size:13px;padding:0 16px 20px}button:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
</style></head><body><div id="app"></div><script>

{n:'FAQ',d:'Encontre o sintoma e siga os passos na ordem. Não pule para a troca de terminal antes de tentar os passos anteriores.',p:[
{t:'Cielo pede dados bancários para cancelar',k:'Senha de cancelamento não cadastrada',b:[P('Isso acontece quando a senha de cancelamento não está cadastrada naquela máquina.'),N('i','Dados da conta','Preencha os dados da conta (banco, agência, conta corrente e senha) informados pela coordenação. Em caso de dúvida, fale com o supervisor.')]},
{t:'Venda errada: cancelar ou estornar',k:'Somente com cartão de gerente',b:[C('Quem pode cancelar','Só é possível com cartão de gerente. Operador não cancela venda.'),C('Quando cancelar','Cancele na hora, com o cliente ainda no ponto. Depois que ele sai, o caso vai para o caixa central.'),N('a','Registre o motivo','Cancelamento sem justificativa aparece no fechamento e volta como pergunta para você.')]},
{t:'Senha de cancelamento por adquirente',k:'Cielo · Rede · PagSeguro',b:[C('Cielo','Senha de cancelamento informada pela coordenação.'),C('Rede','Senha de cancelamento informada pela coordenação.'),C('PagSeguro','Somente com senha de gerente.')]},
{t:'Terminal não liga',k:'Siga os passos na ordem',b:[S('Segure o botão power por 10 segundos.','Conecte no carregador e aguarde 2 minutos antes de tentar de novo.','Teste outra fonte ou tomada, pois o problema pode ser o carregador.','Sem resposta: troque o equipamento e anote os dois seriais no protocolo.')]},
{t:'Não lê a pulseira',k:'Pulseira do cliente não é reconhecida',b:[S('Peça ao cliente que encoste a pulseira no leitor e segure por 2 segundos, sem passar rápido.','Limpe a área do leitor. Copo molhado e adesivo na antena atrapalham a leitura.','Teste com a sua pulseira de teste. Se ela ler, a falha está na pulseira do cliente, não no terminal.','Se o cartão do cliente estiver com defeito, encaminhe ao caixa central CF4.1 para substituição com transferência de saldo.')]},
{t:'Terminal sem sinal / offline',k:'Cashless e cartão se comportam de forma diferente',b:[P('Os dois meios de pagamento se comportam de forma diferente sem sinal. Saber disso evita parar o ponto à toa.'),C('Cashless continua vendendo','Não desligue o aparelho, pois desligar faz você perder vendas. As vendas são enviadas sozinhas quando o sinal volta.'),C('Cartão precisa de sinal para ser aprovado','Sem conexão, débito e crédito não passam. Confirme com a Zig.'),S('Ponto sem sinal: continue vendendo em cashless e mande quem só tem cartão ao caixa central CF4.1.','Se o ponto inteiro cair, avise o supervisor pelo rádio antes de mexer em qualquer equipamento.','Confirme o limite de tempo e de valor em offline configurado para o JR26.')]},
{t:'Cartão negado',k:'Tente uma segunda vez, no máximo',b:[S('Tente uma segunda vez. Insistir além disso pode bloquear o cartão por antifraude e deixar o cliente sem meio de pagamento.','Se a negativa foi por aproximação, peça para inserir o chip.','Se negar de novo, oriente outro cartão ou o caixa central CF4.1 para pagar em dinheiro ou Pix.'),N('e','Nunca pegue o cartão do cliente','Você nunca pega o cartão do cliente na mão e nunca digita o número, nem se o cliente pedir.')]},

function aplicaItem(x,f){const t=x[0],y=x.slice(),ls=z=>String(z).split('\n').map(a=>a.trim()).filter(Boolean);

else if(t=='u'){if(String(f[0]).trim())y[1]=String(f[0]).trim();if(/^https:\/\/[^\s]+$/i.test(String(f[1]).trim()))y[2]=String(f[1]).trim()}
