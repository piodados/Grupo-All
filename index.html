<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Guia de Operação Zig</title><style>
:root{--bg:#F4F7FF;--card:#fff;--ink:#0A1A5C;--tx:#2B3350;--mu:#5B6488;--bl:#0052C2;--cy:#00E5F5;--ln:#D6DFF5;--wa:#FFF4DB;--wt:#7A5200;--in:#E3EEFF;--ok:#E1F7EA;--okt:#0B6B3A;--er:#FDE6E6;--ert:#9B1C1C;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1230;--card:#131C45;--ink:#EAF0FF;--tx:#CBD5F5;--mu:#98A4D0;--ln:#26346E;--wa:#3A2E0B;--wt:#FFD98A;--in:#12285C;--ok:#0E3322;--okt:#8CE8B4;--er:#411616;--ert:#FFB4B4}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.splash{position:fixed;inset:0;background:#0052C2;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.splash img{width:150px;margin-bottom:28px}.splash h1{margin:0 0 10px;font-size:26px;letter-spacing:.5px}.splash p{margin:0;color:#7FF4FF}
.splash .mar img.zg{height:96px}.splash{cursor:pointer}.splash .mar{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:28px}.splash .mar img{height:min(86px,calc((100vw - 66px)/5.1));width:auto;margin:0}.splash h1{text-wrap:balance}.splash .mar h1{margin:0;font-size:clamp(30px,9.5vw,44px);line-height:1}.splash img.vl{height:min(86px,calc((100vw - 66px)/5.1));width:auto;margin:0}.splash .tap{position:absolute;bottom:calc(120px + env(safe-area-inset-bottom,0px));left:0;right:0;font-size:14px;color:#fff;opacity:.85}.splash h1{font-size:28px}.splash:after{content:"";position:absolute;left:12%;bottom:0;width:90px;height:90px;border-radius:0 90px 0 0;background:#00E5F5}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:2;border-bottom:1px solid var(--ln)}
header button{border:0;background:var(--bl);color:#fff;border-radius:10px;padding:8px 12px;font:600 14px inherit;font-family:inherit;cursor:pointer}header b{flex:1;color:var(--ink);font-size:15px}
header img{height:22px}
main{padding:18px 16px 28px;flex:1}h2{color:var(--ink);font-size:24px;line-height:1.2;margin:0 0 6px}.sub{color:var(--mu);margin:0 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;min-height:112px;display:flex;flex-direction:column;gap:10px}
.mvs{display:inline-flex;gap:6px;margin-left:8px}.mv{width:34px;height:34px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--ink);font-size:17px;line-height:1;cursor:pointer}.mv:disabled{opacity:.3;cursor:default}.num{background:var(--bl);color:#fff;border-radius:999px;min-width:36px;height:36px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;white-space:nowrap;align-self:flex-start}
.card span.n{font-weight:700;line-height:1.25}.soon{font-size:12px;color:var(--mu);margin-top:auto}
.item{display:block;width:100%;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:10px;text-align:left;font:inherit;cursor:pointer;color:var(--ink)}.item b{display:block;font-size:17px}.item small{color:var(--mu)}
.box{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}.box h3{margin:0 0 6px;color:var(--ink);font-size:16px}.box p{margin:0}
ol.st{list-style:none;margin:0 0 14px;padding:0;counter-reset:s}ol.st li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--ln)}
ol.st li:before{content:counter(s);background:var(--bl);color:#fff;min-width:28px;height:28px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;white-space:nowrap}
ul{margin:6px 0 0;padding-left:20px}.note{border-radius:12px;padding:12px 14px;margin-bottom:12px}.note b{display:block;font-size:13px}
.a{background:var(--wa);color:var(--wt)}.i{background:var(--in);color:var(--ink)}.o{background:var(--ok);color:var(--okt)}.e{background:var(--er);color:var(--ert)}
pre{white-space:pre-wrap;background:var(--card);border:1px dashed var(--bl);border-radius:12px;padding:14px;font:14px/1.5 ui-monospace,Menlo,monospace;margin:0 0 10px}
.btn{border:0;background:var(--bl);color:#fff;border-radius:12px;padding:12px 16px;font:600 15px inherit;font-family:inherit;width:100%;cursor:pointer;margin-bottom:12px}.btn.l{background:var(--in);color:var(--ink)}
.pn{display:flex;gap:10px;margin-top:18px}.pn .btn{margin:0}.pn .btn:disabled{opacity:.35}
img.f{max-width:220px;width:100%;border-radius:10px;border:1px solid var(--ln);display:block;margin:6px auto 12px}
img.pl{width:100%;border-radius:10px;border:1px solid var(--ln);display:block;margin:8px 0 10px;cursor:zoom-in}.zm{position:fixed;inset:0;background:#000;z-index:9;display:flex;flex-direction:column}.zb{padding:10px 12px;text-align:right}.zb button{border:0;background:#fff;color:#000;border-radius:10px;padding:8px 14px;font:600 14px system-ui}.zs{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}.zs img{width:220%;max-width:none;display:block}
label{display:block;margin:10px 0;font-size:14px;color:var(--mu)}label input{display:block;width:100%;margin-top:4px;padding:12px;border:1px solid var(--ln);border-radius:10px;background:var(--card);color:var(--ink);font:16px inherit;font-family:inherit}p,li,.note,.sub{white-space:pre-line}label textarea{display:block;width:100%;margin-top:4px;padding:12px;border:1px solid var(--ln);border-radius:10px;background:var(--card);color:var(--ink);font:16px/1.4 inherit;font-family:inherit;resize:vertical;box-sizing:border-box}.mv.ed{margin-left:8px}.row .mv.ed{margin:0 8px 0 auto;flex:none}.mu{color:var(--mu);font-size:13px;min-height:18px}.zm2{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9;display:flex;align-items:flex-end;justify-content:center}.zm2 .mb{background:var(--bg);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}.zm2 h3{margin:0 0 10px;color:var(--ink)}.zm2 .btn{margin-bottom:8px}details{display:block}.tree details{background:var(--card);border:1px solid var(--ln);border-radius:12px;margin-bottom:8px}.tree details details{margin:0 10px 8px;background:var(--bg)}.tree summary{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;list-style:none;min-height:52px}.tree summary::-webkit-details-marker{display:none}.tree .ch{color:var(--mu);font-size:20px;line-height:1;transition:transform .12s;width:12px}.tree details[open]>summary>.ch{transform:rotate(90deg)}.tree .lab{flex:1;min-width:0;color:var(--ink)}.tree .lab b{display:block;line-height:1.3}.tree .lab small{color:var(--mu);font-size:12px}.tree .tag{display:none;font-size:12px;color:var(--wt);background:var(--wa);border-radius:99px;padding:2px 8px}.tree .off>summary .tag{display:inline}.tree details.off>.kids{opacity:.5}.tree .row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--ln);min-height:48px;font-size:14px}.tree .row.off .lab{text-decoration:line-through;opacity:.6}input.sw{-webkit-appearance:none;appearance:none;width:48px;height:28px;border-radius:99px;background:#8d97b8;position:relative;flex:none;cursor:pointer;margin:0;transition:background .15s}input.sw:before{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}input.sw:checked{background:var(--bl)}input.sw:checked:before{transform:translateX(20px)}input.sw:focus-visible{outline:3px solid var(--cy);outline-offset:2px}.lk{background:none;border:0;padding:0;font:inherit;color:LinkText;text-decoration:underline;cursor:pointer}.toast{display:none;position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:488px;margin:0 auto;background:#0A1A5C;color:#fff;padding:12px 14px;border-radius:12px;z-index:20;font-size:14px}footer{text-align:center;color:var(--mu);font-size:13px;padding:0 16px 20px}button:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
</style></head><body><div id="app"></div><script>

const B=[
{n:'FAQ',d:'Encontre o sintoma e siga os passos na ordem. Não pule para a troca de terminal antes de tentar os passos anteriores.',p:[
{t:'Cielo pede dados bancários para cancelar',k:'Senha de cancelamento não cadastrada',b:[P('Isso acontece quando a senha de cancelamento não está cadastrada naquela máquina.'),N('i','Dados da conta','Preencha os dados da conta (banco, agência, conta corrente e senha) informados pela coordenação. Em caso de dúvida, fale com o supervisor.')]},
{t:'Venda errada: cancelar ou estornar',k:'Somente com cartão de gerente',b:[C('Quem pode cancelar','Só é possível com cartão de gerente. Operador não cancela venda.'),C('Quando cancelar','Cancele na hora, com o cliente ainda no ponto. Depois que ele sai, o caso vai para o caixa central.'),N('a','Registre o motivo','Cancelamento sem justificativa aparece no fechamento e volta como pergunta para você.')]},
{t:'Senha de cancelamento por adquirente',k:'Cielo · Rede · PagSeguro',b:[C('Cielo','Senha de cancelamento informada pela coordenação.'),C('Rede','Senha de cancelamento informada pela coordenação.'),C('PagSeguro','Somente com senha de gerente.')]},
{t:'Terminal não liga',k:'Siga os passos na ordem',b:[S('Segure o botão power por 10 segundos.','Conecte no carregador e aguarde 2 minutos antes de tentar de novo.','Teste outra fonte ou tomada, pois o problema pode ser o carregador.','Sem resposta: troque o equipamento e anote os dois seriais no protocolo.')]},
{t:'Não lê a pulseira',k:'Pulseira do cliente não é reconhecida',b:[S('Peça ao cliente que encoste a pulseira no leitor e segure por 2 segundos, sem passar rápido.','Limpe a área do leitor. Copo molhado e adesivo na antena atrapalham a leitura.','Teste com a sua pulseira de teste. Se ela ler, a falha está na pulseira do cliente, não no terminal.','Se o cartão do cliente estiver com defeito, encaminhe ao caixa central CF4.1 para substituição com transferência de saldo.')]},
{t:'Terminal sem sinal / offline',k:'Cashless e cartão se comportam de forma diferente',b:[P('Os dois meios de pagamento se comportam de forma diferente sem sinal. Saber disso evita parar o ponto à toa.'),C('Cashless continua vendendo','Não desligue o aparelho, pois desligar faz você perder vendas. As vendas são enviadas sozinhas quando o sinal volta.'),C('Cartão precisa de sinal para ser aprovado','Sem conexão, débito e crédito não passam. Confirme com a Zig.'),S('Ponto sem sinal: continue vendendo em cashless e mande quem só tem cartão ao caixa central CF4.1.','Se o ponto inteiro cair, avise o supervisor pelo rádio antes de mexer em qualquer equipamento.','Confirme o limite de tempo e de valor em offline configurado para o JR26.')]},
{t:'Cartão negado',k:'Tente uma segunda vez, no máximo',b:[S('Tente uma segunda vez. Insistir além disso pode bloquear o cartão por antifraude e deixar o cliente sem meio de pagamento.','Se a negativa foi por aproximação, peça para inserir o chip.','Se negar de novo, oriente outro cartão ou o caixa central CF4.1 para pagar em dinheiro ou Pix.'),N('e','Nunca pegue o cartão do cliente','Você nunca pega o cartão do cliente na mão e nunca digita o número, nem se o cliente pedir.')]},
{t:'Não passa por aproximação',k:'Cartão não é lido por aproximação',b:[S('Peça ao cliente que encoste o cartão e segure por 2 segundos, sem passar rápido.','Se não ler, insira o cartão pelo chip.','Cartão sem chip e sem aproximação: caixa central CF4.1.','Se nenhum cartão passa por aproximação nesse terminal, o problema é o terminal, não os cartões. Chame o supervisor.')]},
{t:'Não sei se a venda passou',k:'Risco de cobrança dupla',b:[N('e','Atenção','Há risco de cobrança dupla. Trate como o caso mais grave do dia.'),S('Não repita a cobrança por instinto. Confirme antes.','Consulte as últimas vendas no terminal. Se a transação estiver lá, ela passou.','Se passou mas não imprimiu, o problema é a impressora. Não cobre de novo.','Se não conseguir resolver no terminal, chame o supervisor. Cobrança duplicada vira reclamação formal e entra no fechamento.')]},
{t:'Acabou a bobina / não imprime',k:'Papel e impressora',b:[S('Abra a tampa e confira o sentido do papel: o lado térmico deve ficar voltado para a cabeça de impressão.','Feche até ouvir o clique e puxe a sobra de papel.','Repor com estoque do ponto e avisar o supervisor quando o ponto ficar com menos de 2 bobinas.')]},
{t:'Cliente diz que o saldo está errado',k:'Mostre o extrato, não prometa valores',b:[S('Consulte o extrato da pulseira no terminal, na frente do cliente.','Nunca prometa valor, crédito ou estorno. Você mostra o extrato; quem decide é o caixa central.','Encaminhe ao caixa central CF4.1, no setor 4.')]},
{t:'Produto não aparece no terminal',k:'Confira o cardápio do ponto',b:[S('Confirme se o terminal está no cardápio do ponto certo. Terminal trocado de PDV mostra o cardápio errado.','Não venda item parecido no lugar do pedido. Isso quebra o fechamento do parceiro.','Acione o supervisor Zig para ajuste de cardápio no backoffice.')]}]},
{n:'Pedir Ajuda',d:'Precisa de ajuda? Siga o fluxo correto.',p:[
{t:'Como pedir ajuda',k:'Chamado ao grupo da operação',b:[P('O chamado vai para o grupo da operação. Para assuntos pontuais, ligue direto para o supervisor do seu setor.'),P('O texto sai formatado com data, hora e OS, e você escolhe o grupo na hora de enviar.'),N('e','Casos urgentes','Ligue para o supervisor do seu setor.')]},
{t:'Texto padrão para abertura de chamado',k:'Copie e cole no grupo principal',b:[['copy','🚨 ABERTURA DE CHAMADO\nNome:\nOperador:\nPonto de venda:\nNível:\nDescrição da ocorrência:\nO que foi verificado/tentado:\nEvidências:\nFoto:\nVídeo:\nImpacto na operação:\nAguardando orientação.'],P('Copie e cole este texto no grupo principal do evento.')]},
{t:'Contatos por setor',k:'Supervisores e RH Zig',b:[['sup']]},
{t:'Quem é quem no JR26',k:'Glossário',b:[C('Talk','Gestora do A&B e ponto focal de demandas com a Zig.'),C('Zig','Sistema de gestão de pagamento oficial do evento.'),C('C2','Gestora da operação do caixa central.'),C('Hops','Operadora de bares e ambulantes de bebida.'),C('Parceiros de alimentação','Mais de 30 operadores, sob gestão da Talk.')]}]},
{n:'Operação',d:'Operação híbrida: o cliente escolhe como pagar.',p:[
{t:'Operação híbrida',k:'Cartão ou cashless × dinheiro ou Pix',b:[N('i','Evento','João Rock 2026 · 1º de agosto · Ribeirão Preto, SP · operação híbrida.'),P('Neste ano, o cliente escolhe como pagar. Há dois caminhos, e encaminhar o cliente pelo errado gera fila.'),C('Cartão ou cashless','Débito, crédito e cashless são cobrados direto no ponto de consumo, sem passar pelo caixa. O cliente faz o pedido e paga ali, por aproximação ou inserindo o cartão.'),C('Só dinheiro ou Pix','O cliente vai ao caixa central, setor 4 (código CF4.1 na planta), ao lado da loja de produtos oficiais. Lá ele carrega um cartão cashless com dinheiro ou Pix.'),C('Por que o Pix não está no ponto','O Pix depende do sinal do celular do cliente, e o ponto de consumo não pode ficar esperando sinal. Por isso o Pix foi concentrado no caixa central.')]}]},
{n:'Plantas',d:'Baixe a planta do seu setor antes de entrar em campo.',p:[
{t:'Plantas dos setores',k:'Planta geral e setores 1 a 8',b:[N('a','Baixe antes de entrar','Toque no setor para baixar a planta. Dentro do evento o sinal cai e o download trava.'),['u','Planta geral (todos os setores)','https://manualops-jr26.vercel.app/plantas/planta-geral.pdf'],['u','Setor 1','https://manualops-jr26.vercel.app/plantas/setor-1.pdf'],['u','Setor 2','https://manualops-jr26.vercel.app/plantas/setor-2.pdf'],['u','Setor 3','https://manualops-jr26.vercel.app/plantas/setor-3.pdf'],['u','Setor 4','https://manualops-jr26.vercel.app/plantas/setor-4.pdf'],['u','Setor 5','https://manualops-jr26.vercel.app/plantas/setor-5.pdf'],['u','Setor 6','https://manualops-jr26.vercel.app/plantas/setor-6.pdf'],['u','Setor 7','https://manualops-jr26.vercel.app/plantas/setor-7.pdf'],['u','Setor 8','https://manualops-jr26.vercel.app/plantas/setor-8.pdf'],N('i','Tudo converge para o CF4.1','Não há posto de atendimento espalhado pelo evento. Dúvidas de saldo, cartão com defeito e reclamação de cobrança vão todas para o caixa central, no setor 4. Antes de mandar o cliente atravessar o evento, resolva o que for possível no seu ponto: consultar extrato, testar o cartão ou cancelar uma venda recém-feita.')]}]},
{n:'Reembolso',d:'Devolução de saldo do cartão cashless.',p:[
{t:'Antes de explicar',k:'Descubra como o cliente carregou',b:[P('A devolução de saldo só existe para quem tem saldo no cartão cashless. Quem pagou tudo no débito ou crédito não tem saldo a receber.'),P('Antes de explicar qualquer coisa, descubra como o cliente carregou.')]},
{t:'Cenário A: pré-carga e sem recarga no evento',k:'Devolução automática',b:[C('Como funciona','Devolução automática, sem formulário e sem fila.'),C('Para onde vai o crédito','O crédito volta para o mesmo cartão ou Pix usado na pré-carga, no prazo do banco, em geral até 2 faturas.'),C('Quem tem direito','Quem fez pré-carga pelo site, que encerrou em 30/07.')]},
{t:'Cenário B: recarga durante o evento',k:'Reembolso manual pelo formulário',b:[N('a','Atenção','O reembolso automático não vale. Quem recarregou, mesmo tendo feito pré-carga, entra no reembolso manual.'),C('Como pedir','Pelo formulário em reembolsocashless.com.br/joaorock2026.'),C('Período para pedir','De 3 a 12 de agosto de 2026. Depois de 12/08 não há mais como pedir.'),C('Pagamento','Em até 60 dias após o pedido.'),C('Taxa e valor','Sem taxa. Devolve o saldo restante, descontado o bônus.')]},
{t:'Cenário C: devolução em dinheiro, no evento',k:'No caixa central, setor 4 (CF4.1)',b:[C('Onde','No caixa central, setor 4 (CF4.1).'),C('Quando','Durante todo o funcionamento do evento. O cliente não precisa esperar o fim.'),N('a','Fila','Não há fila exclusiva: é a mesma fila da carga. Quem deixar para o fim do evento enfrenta a fila mais cheia.')]},
{t:'Pontos que geram discussão',k:'O que explicar na hora da carga',b:[C('Bônus não vira dinheiro','Só o valor pago pelo cliente é devolvido. Isso deve ser explicado na hora da carga.'),C('Recarregar no evento cancela o reembolso automático','Por exemplo, recarregar R$ 10 pode fazer o cliente perder uma devolução fácil de R$ 80. Avise antes.'),C('Não prometa valor nem prazo','Dúvidas de saldo vão para o caixa central CF4.1.'),C('Exceção','Quem fez pré-carga e recarregou no evento não resolve no caixa. Esse cliente usa o formulário, de 3 a 12 de agosto. Encaminhá-lo ao CF4.1 só gera fila à toa.')]}]},

function camposId(id,orig){const m=/^b(\d+)(?:p(\d+))?(?:c(\d+))?$/.exec(id),i=+m[1],j=m[2]!=null?+m[2]:null,k=m[3]!=null?+m[3]:null,S=orig?BO:B;
if(j==null)return[{r:'Nome do bloco',v:S[i].n},{r:'Descrição (aparece abaixo do nome)',v:S[i].d||'',m:1}];
if(k==null)return[{r:'Título da tela',v:S[i].p[j].t},{r:'Subtítulo',v:S[i].p[j].k||'',m:1}];
return camposItem(S[i].p[j].b[k])}
function reGest(){const ab=[...document.querySelectorAll('#tree details[open]')].map(d=>d.dataset.id),y=window.scrollY;render();
ab.forEach(id=>{const d=document.querySelector('#tree details[data-id="'+id+'"]');if(d)d.open=true});window.scrollTo(0,y)}
function editT(e,id){e.preventDefault();e.stopPropagation();const cs=camposId(id,false);if(!cs.length)return;
const d=ov('<h3>Editar texto</h3>'+cs.map((c,n)=>'<label>'+h(c.r)+(c.m?'<textarea id="tx'+n+'" rows="'+Math.min(10,Math.max(3,LN(c.v).split('\n').length+1))+'"></textarea>':'<input id="tx'+n+'" type="text" autocomplete="off">')+'</label>').join('')+'<p id="ms" class="mu"></p><button class="btn" id="sv">Salvar</button>'+(TX[id]?'<button class="btn l" id="rs">Voltar ao texto original</button>':'')+'<button class="btn l" id="cn">Cancelar</button>');
cs.forEach((c,n)=>{d.querySelector('#tx'+n).value=c.v});
const $q=q=>d.querySelector(q);$q('#cn').onclick=()=>d.remove();
const grava=async(novo)=>{const m=$q('#ms'),prev=TX;TX={...TX};if(novo)TX[id]=novo;else delete TX[id];applyTx();m.textContent='Salvando…';
try{await saveCfg();d.remove();reGest();toast('Texto salvo para todos os usuários.')}catch(er){TX=prev;applyTx();d.style.display='';d.querySelector('#ms').textContent='Não foi possível salvar: '+er.message}};
$q('#sv').onclick=async()=>{const f=cs.map((c,n)=>$q('#tx'+n).value);const o=camposId(id,true).map(c=>LN(c.v));
if(!String(f[0]).trim()){$q('#ms').textContent='O primeiro campo não pode ficar vazio.';return}
const igual=f.every((v,n)=>v.trim()==o[n].trim());
if(igual)return grava(null);
const bt=$q('#sv');bt.disabled=true;bt.textContent='Revisando a ortografia…';$q('#ms').textContent='';
let itens=[];try{const r=await api('/api/revisar',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOK},body:JSON.stringify({textos:f})});itens=r.itens||[]}catch(er){$q('#ms').textContent='Revisão ortográfica indisponível agora. Salvando sem revisar.'}
bt.disabled=false;bt.textContent='Salvar';
if(!itens.length)return grava(f);
revisao(d,f,itens,cs,grava)};
const rs=$q('#rs');if(rs)rs.onclick=()=>grava(null)}
// Mostra as sugestões do corretor; o usuário escolhe uma correção ou mantém o que escreveu.
function revisao(dEd,f,itens,cs,grava){dEd.style.display='none';const esc=h;
const esc2=(t,o,n)=>{const a=Math.max(0,o-24),b=Math.min(t.length,o+n+24);return(a>0?'…':'')+esc(t.slice(a,o))+'<mark>'+esc(t.slice(o,o+n))+'</mark>'+esc(t.slice(o+n,b))+(b<t.length?'…':'')};
const esc3=t=>t.replace(/\n/g,' ');
const pick=itens.map(()=>-1);
const d=ov('<h3>Revisão ortográfica</h3><p class="mu" style="min-height:0">Encontramos '+itens.length+' sugest'+(itens.length==1?'ão':'ões')+'. Toque na correção desejada ou mantenha o texto como está.</p><div id="rv"></div><button class="btn" id="rs2">Salvar</button><button class="btn l" id="rv0">Voltar a editar</button>');
const rv=d.querySelector('#rv');
const draw=()=>{rv.innerHTML=itens.map((it,k)=>'<div class="box" style="margin:8px 0"><p style="margin:0 0 6px;font-size:13px">'+esc2(esc3(f[it.c]),it.o,it.n)+'</p>'+(it.m?'<p class="mu" style="min-height:0;margin:0 0 6px">'+esc(it.m)+'</p>':'')+'<div style="display:flex;flex-wrap:wrap;gap:6px">'+it.s.map((x,n)=>'<button type="button" class="mv" style="width:auto;height:auto;padding:8px 12px;font-size:14px;'+(pick[k]==n?'background:var(--bl);color:#fff':'')+'" data-k="'+k+'" data-n="'+n+'">'+esc(x)+'</button>').join('')+'<button type="button" class="mv" style="width:auto;height:auto;padding:8px 12px;font-size:14px;'+(pick[k]==-1?'background:var(--bl);color:#fff':'')+'" data-k="'+k+'" data-n="-1">Manter “'+esc(it.w)+'”</button></div></div>').join('')};
draw();
rv.onclick=e=>{const b=e.target.closest('button[data-k]');if(!b)return;pick[+b.dataset.k]=+b.dataset.n;draw()};
d.querySelector('#rv0').onclick=()=>{d.remove();dEd.style.display=''};
d.querySelector('#rs2').onclick=()=>{const nf=f.slice();
// aplica de trás para a frente para não deslocar as posições
itens.map((it,k)=>({it,k})).filter(x=>pick[x.k]>=0).sort((a,b)=>b.it.o-a.it.o).forEach(({it,k})=>{const t=nf[it.c];nf[it.c]=t.slice(0,it.o)+it.s[pick[k]]+t.slice(it.o+it.n)});
d.remove();grava(nf)}}
function renumber(){let n=0;document.querySelectorAll('#tree details.lv1').forEach(d=>{const i=+d.dataset.b;const e=d.querySelector('.bn');if(e)e.textContent=OFF['b'+i]?'–':++n});
const t=[...document.querySelectorAll('#tree details.lv1')];t.forEach((d,k)=>{const [u,w]=d.querySelectorAll('.mv');if(u)u.disabled=k==0;if(w)w.disabled=k==t.length-1})}
function mv(e,i,dir){e.preventDefault();e.stopPropagation();const o=ordem(),p=o.indexOf(i),q=p+dir;if(q<0||q>=o.length)return;
[o[p],o[q]]=[o[q],o[p]];ORD=o;
const tree=document.getElementById('tree'),d=tree.querySelector('details.lv1[data-b="'+i+'"]');
if(d){const nb=dir<0?d.previousElementSibling:d.nextElementSibling;if(nb){if(dir<0)tree.insertBefore(d,nb);else tree.insertBefore(nb,d)}}
renumber();saveOff()}
function flag(e){const i=e.target;if(!i.classList||!i.classList.contains('sw'))return;
const id=i.dataset.id;if(i.checked)delete OFF[id];else OFF[id]=true;
const el=i.closest('details,.row');if(el)el.classList.toggle('off',!i.checked);if(/^b\d+$/.test(id))renumber();saveOff()}
let TOK=null;
async function api(path,opt){const r=await fetch(path,opt);let j=null;try{j=await r.json()}catch(e){}if(!r.ok)throw new Error((j&&j.erro)||('Erro '+r.status));return j}
async function saveCfg(){gst('Salvando…');try{await api('/api/config',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOK},body:JSON.stringify({off:OFF,sup:SUP,ord:ordem(),tx:TX,add:ADD})});gst('Salvo ✓')}catch(e){gst('Não foi possível salvar: '+e.message);throw e}}
function saveOff(){SAVEQ=SAVEQ.then(()=>saveCfg()).catch(()=>{})}
function syncTree(){document.querySelectorAll('#tree input.sw').forEach(i=>{const on=!OFF[i.dataset.id];i.checked=on;const el=i.closest('details,.row');if(el)el.classList.toggle('off',!on)});renumber()}
function resetAll(){const d=ov('<h3>Reativar todos os itens?</h3><p>Tudo voltará a aparecer para os usuários.</p><button class="btn" id="ok">Reativar todos</button><button class="btn l" id="cn">Cancelar</button>');d.querySelector('#cn').onclick=()=>d.remove();d.querySelector('#ok').onclick=()=>{OFF={};d.remove();syncTree();saveOff()}}
function ov(x){const d=document.createElement('div');d.className='zm2';d.innerHTML='<div class="mb">'+x+'</div>';d.onclick=e=>{if(e.target==d)d.remove()};document.body.appendChild(d);return d}
function editC(k){
const cur=SUP[k]&&!SUP[k].vazio?SUP[k]:{};const ti=(NIV.find(x=>x[0]==k)||[0,k])[1];
const d=ov('<h3>'+h(ti)+'</h3><button class="btn" id="pk">Escolher da agenda do celular</button><label>Nome<input id="nm" value="'+h(cur.nome||'')+'" autocomplete="off"></label><label>Telefone ou link do grupo do WhatsApp<input id="tf" type="text" inputmode="text" autocapitalize="none" autocorrect="off" placeholder="21 99999-9999 ou https://chat.whatsapp.com/..." value="'+h(cur.tel||'')+'" autocomplete="off"></label><p id="ms" class="mu"></p><button class="btn" id="sv">Salvar</button>'+((SUP[k]&&!SUP[k].vazio)?'<button class="btn l" id="ex" style="color:#ff8a8a">Excluir contato</button>':'')+'<button class="btn l" id="cn">Cancelar</button>');
const $q=s=>d.querySelector(s);
$q('#cn').onclick=()=>d.remove();
const ex=$q('#ex');if(ex)ex.onclick=async()=>{const m=$q('#ms');
if(ex.dataset.ok!='1'){ex.dataset.ok='1';ex.textContent='Toque de novo para confirmar a exclusão';return}
const nx={...SUP,[k]:{nome:'',tel:'',vazio:true}};
const prev=SUP;SUP=nx;m.textContent='Excluindo…';try{await saveCfg();d.remove();render();toast('Contato excluído para todos os usuários.')}catch(e){SUP=prev;m.textContent='Não foi possível excluir: '+e.message}};
$q('#pk').onclick=async()=>{const m=$q('#ms');
if(!(navigator.contacts&&navigator.contacts.select)){m.textContent='Este aparelho ou navegador não permite abrir a agenda por aqui (comum no iPhone). Digite o nome e o telefone.';return}
try{const r=await navigator.contacts.select(['name','tel'],{multiple:false});if(r&&r[0]){$q('#nm').value=(r[0].name||[])[0]||$q('#nm').value;$q('#tf').value=(r[0].tel||[])[0]||''}}catch(e){m.textContent='Não foi possível abrir a agenda. Digite o nome e o telefone.'}};
$q('#sv').onclick=async()=>{const nome=$q('#nm').value.trim(),tel=$q('#tf').value.trim();const m=$q('#ms');
if(!grp(tel)&&tel.replace(/\D/g,'').length<10){m.textContent='Informe um telefone com DDD ou o link de um grupo do WhatsApp (chat.whatsapp.com/...).';return}
const nx={...SUP,[k]:{nome,tel}};
const prev=SUP;SUP=nx;try{await saveCfg();d.remove();render();toast('Contato salvo para todos os usuários.')}catch(e){SUP=prev;m.textContent='Não foi possível salvar: '+e.message}}}
let ROLE=null,NOME='',USERS=[];
function admLogin(mode){const reg=mode=='reg';
const d=ov('<h3>'+(reg?'Cadastrar novo usuário':'Acesso administrador')+'</h3>'
+(reg?'<label>Nome<input id="nm2" autocomplete="name"></label>':'')
+'<label>Login<input id="lg" autocomplete="username" autocapitalize="none" autocorrect="off"></label>'
+'<label>Senha<input id="pw" type="password" autocomplete="'+(reg?'new-password':'current-password')+'"></label>'
+(reg?'<label>Repetir a senha<input id="pw2" type="password" autocomplete="new-password"></label><p class="mu" style="min-height:0">Login: de 3 a 30 caracteres, com letras minúsculas, números, ponto, hífen ou sublinhado. Senha: no mínimo 8 caracteres. Depois do cadastro, o administrador precisa aprovar o seu acesso.</p>':'')
+'<p id="ms" class="mu" role="status"></p><button class="btn" id="en">'+(reg?'Enviar cadastro':'Entrar')+'</button><button class="btn l" id="sw">'+(reg?'Já tenho usuário: entrar':'Cadastrar')+'</button><button class="btn l" id="cn">Cancelar</button>');
const $q=s=>d.querySelector(s);$q('#cn').onclick=()=>d.remove();
$q('#sw').onclick=()=>{d.remove();admLogin(reg?'in':'reg')};
const lastId=reg?'#pw2':'#pw';
const enviar=async()=>{const m=$q('#ms');const login=$q('#lg').value.trim(),senha=$q('#pw').value;
if(reg){const nome=$q('#nm2').value.trim();
if(senha!==$q('#pw2').value){m.textContent='As senhas não são iguais.';return}
m.textContent='Enviando…';
try{await api('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome,login,senha})});
d.querySelector('.mb').innerHTML='<h3>Cadastro enviado</h3><p>O administrador foi avisado. Quando ele aprovar, entre com o login <b>'+h(login.toLowerCase())+'</b> e a senha que você escolheu.</p><button class="btn" id="ok">Entendi</button>';d.querySelector('#ok').onclick=()=>d.remove()}
catch(e){m.textContent=e.message}return}
m.textContent='Verificando…';
try{const j=await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login,senha})});
TOK=j.token;ROLE=j.role;NOME=j.nome||'';ADM=true;d.remove();await loadCfg();await loadUsers();render()}
catch(e){m.textContent=e.message||'Login ou senha incorretos.'}};
$q('#en').onclick=enviar;$q(lastId).onkeydown=e=>{if(e.key=='Enter')enviar()}}
async function loadUsers(){if(ROLE!='master')return;try{const j=await api('/api/users',{headers:{Authorization:'Bearer '+TOK}});USERS=j.users||[]}catch(e){USERS=[]}}
const npend=()=>USERS.filter(u=>u.status=='pendente').length;
function usersHtml(){const p=USERS.filter(u=>u.status=='pendente'),a=USERS.filter(u=>u.status=='ativo');
const dt=u=>u.criadoEm?' · '+h(new Date(u.criadoEm).toLocaleDateString('pt-BR')):'';
const card=(u,pend)=>'<div class="box"><h3>'+h(u.nome||u.login)+'</h3><p class="mu" style="min-height:0;margin-bottom:10px">Login: '+h(u.login)+dt(u)+'</p>'+(pend?'<button class="btn" onclick="usrAct(\'aprovar\',\''+h(u.login)+'\')">Aprovar acesso</button><button class="btn l" onclick="usrAct(\'recusar\',\''+h(u.login)+'\')">Recusar</button>':'<button class="btn l" onclick="usrAct(\'remover\',\''+h(u.login)+'\')">Remover acesso</button>')+'</div>';
return'<main><h2>Usuários e acessos</h2><p class="sub">Aprove só quem você conhece. Quem for aprovado pode alterar contatos e a exibição dos itens.</p>'
+'<h3 style="color:var(--ink);margin:18px 0 8px">Aguardando aprovação ('+p.length+')</h3>'+(p.length?p.map(u=>card(u,true)).join(''):'<p class="mu">Nenhum pedido no momento.</p>')
+'<h3 style="color:var(--ink);margin:18px 0 8px">Com acesso ('+a.length+')</h3>'+(a.length?a.map(u=>card(u,false)).join(''):'<p class="mu">Ninguém além de você.</p>')
+'<button class="btn l" onclick="usrReload()">Atualizar lista</button></main>'}
async function usrReload(){await loadUsers();render()}
function usrAct(acao,login){
const run=async()=>{try{await api('/api/users',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOK},body:JSON.stringify({acao,login})});await loadUsers();render();toast(acao=='aprovar'?'Acesso aprovado.':acao=='recusar'?'Pedido recusado.':'Acesso removido.')}catch(e){toast('Não foi possível concluir: '+e.message)}};
if(acao=='aprovar')return run();
const d=ov('<h3>'+(acao=='remover'?'Remover o acesso?':'Recusar o cadastro?')+'</h3><p>'+h(login)+'</p><button class="btn" id="ok">Confirmar</button><button class="btn l" id="cn">Cancelar</button>');
d.querySelector('#cn').onclick=()=>d.remove();d.querySelector('#ok').onclick=()=>{d.remove();run()}}
function admOut(){ADM=false;TOK=null;ROLE=null;NOME='';USERS=[];render()}
async function loadCfg(){try{const j=await api('/api/config',{cache:'no-store'});if(j&&j.exists){OFF=j.off||{};SUP=j.sup||{};ORD=Array.isArray(j.ord)?j.ord:[];TX=j.tx&&typeof j.tx=='object'?j.tx:{};ADD=normAdd(j.add);buildB();applyTx()}}catch(e){}}
const livre=()=>v.s!='splash'&&!document.querySelector('.zm2,.zm');
async function initCaps(){await loadCfg();if(livre()&&!ADM)render();
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState=='visible'&&!ADM){await loadCfg();if(livre())render()}})}
function cp(){const t=document.getElementById('cp').textContent;const ok=()=>event.target.textContent='Copiado ✓';try{navigator.clipboard.writeText(t).then(ok,()=>0)}catch(e){}}
function go(n){v=n;history.pushState(n,'');render();scrollTo(0,0)}
function bk(){history.back()}
onpopstate=e=>{v=e.state||{s:'home'};render()};
function hd(t){return'<header><button onclick="bk()" aria-label="Voltar">← Voltar</button><b>'+h(t)+'</b><img src="'+LC+'" alt="Zig" onclick="go({s:\'home\'})"></header>'}
function render(){let o='';
if(v.s=='gestao'&&!ADM)v={s:'home'};

else if(v.s=='home'){const vb=vbl();
o='<main><h2>Como utilizar este guia</h2><p class="sub">Este material está dividido em '+vb.length+' bloco'+(vb.length==1?'':'s')+'. Consulte diretamente o bloco que precisar durante o evento.</p><div class="grid">'+vb.map((i,k)=>'<button class="card" onclick="go({s:\'block\',b:'+i+'})"><span class="num">'+(k+1)+'</span><span class="n">'+h(B[i].n)+'</span>'+(vpages(i).length?'':'<span class="soon">Em breve</span>')+'</button>').join('')+'</div><div style="margin-top:18px">'+(ADM?'<div class="note i"><b>Modo administrador ativo'+(NOME?' · '+h(NOME):'')+'</b>Use a gestão para escolher o que aparece e, em Pedir Ajuda › Níveis de suporte, para editar os contatos.</div><button class="btn" onclick="go({s:\'gestao\'})">Gestão do aplicativo</button>'+(ROLE=='master'?'<button class="btn l" onclick="go({s:\'usuarios\'})">Usuários e acessos'+(npend()?' ('+npend()+' pendente'+(npend()==1?'':'s')+')':'')+'</button>':'')+'<button class="btn l" onclick="admOut()">Sair do modo administrador</button>':'<button class="btn l" onclick="admLogin()">Acesso administrador</button>')+'</div></main><footer>Uma boa operação começa com um bom preparo. Consulte o guia sempre que precisar.</footer>'}
else if(v.s=='gestao')o=hd('Gestão do aplicativo')+gestaoHtml();

$.innerHTML=o}
function enter(){history.replaceState({s:'home'},'');v={s:'home'};render();scrollTo(0,0)}
render();initCaps();
</script></body></html>
